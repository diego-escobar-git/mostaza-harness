[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mostaza-harness"
version = "0.1.0"
description = "Reproducible host tooling for hybrid code retrieval research"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyYAML>=6.0.2,<7"]

[dependency-groups]
dev = [
  "build>=1.2.2,<2",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
  "setuptools==80.9.0",
  "types-PyYAML>=6.0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "--strict-markers"
markers = ["historical_evidence: requires the retained immutable phase-2 evidence checkout"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
